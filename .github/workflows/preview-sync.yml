name: preview-sync

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source commit SHA (recommended) or branch name in education-tools-hash/for-all-children-to-learn"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source repo at source_ref (public, read-only)
        uses: actions/checkout@v4
        with:
          repository: education-tools-hash/for-all-children-to-learn
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 1

      - name: Resolve and verify actual synced commit SHA
        id: resolve
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          actual_sha=$(git -C source rev-parse HEAD)
          echo "Resolved source_ref '$SOURCE_REF' -> $actual_sha"
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            if [ "$SOURCE_REF" != "$actual_sha" ]; then
              echo "::error::source_ref looked like a full SHA but does not match the checked-out commit (requested $SOURCE_REF, got $actual_sha). Refusing to deploy."
              exit 1
            fi
          fi
          {
            echo "actual_sha=$actual_sha"
            echo "synced_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build preview artifact (explicit allowlist only, source files copied unmodified)
        run: |
          set -euo pipefail
          mkdir -p dist/assets/js dist/assets/sakana-tsuri dist/app-details dist/assets/icons dist/assets/mockups

          # --- Explicit allowlist: the 5 target apps for this Preview, and only the
          # relative-path dependencies they actually load. No wildcard/full-tree copy.
          #   directions-app.html -> assets/js/directions-record-detail.js
          #   timetable-app.html  -> favicon.png / favicon.svg / apple-touch-icon.png
          #                          (relative <link> hrefs, no leading slash, so they
          #                          resolve against this same directory) ---
          cp source/schedule-app.html      dist/
          cp source/timetable-app.html     dist/
          cp source/cup_game.html          dist/
          cp source/directions-app.html    dist/
          cp source/ongaku-app.html        dist/
          cp source/sst-app.html           dist/
          cp source/learning-records.html  dist/
          cp source/assets/js/directions-record-detail.js dist/assets/js/
          cp source/assets/js/sst-record-detail.js        dist/assets/js/
          cp source/assets/js/record-dashboard-foundation.js dist/assets/js/
          cp source/assets/js/record-dashboard-ui.js         dist/assets/js/
          cp source/favicon.png            dist/
          cp source/favicon.svg            dist/
          cp source/apple-touch-icon.png   dist/
          cp source/sawatte-hirogaru-app.html                  dist/
          cp source/assets/js/record-trace-renderer.js         dist/assets/js/
          cp source/assets/js/sawatte-hirogaru-record-detail.js dist/assets/js/
          cp source/app-details/sawatte-hirogaru-app-detail.html dist/app-details/
          cp source/assets/mockups/sawatte-hirogaru-app.png    dist/assets/mockups/
          cp source/sakana-tsuri.html                          dist/
          cp source/assets/sakana-tsuri/pond-background.jpg    dist/assets/sakana-tsuri/
          cp source/assets/sakana-tsuri/orange-fish.png        dist/assets/sakana-tsuri/
          cp source/assets/sakana-tsuri/fishing-rod.png        dist/assets/sakana-tsuri/
          cp source/assets/sakana-tsuri/pond-autumn.jpg        dist/assets/sakana-tsuri/
          cp source/assets/sakana-tsuri/forest-stream.jpg      dist/assets/sakana-tsuri/
          cp source/assets/sakana-tsuri/red-white-fish.png     dist/assets/sakana-tsuri/
          cp source/assets/sakana-tsuri/spotted-fish.png       dist/assets/sakana-tsuri/
          cp source/assets/js/sakana-tsuri-record-detail.js    dist/assets/js/

          # APP-DETAILS-VISUAL-ENHANCEMENT-FISHING-PREVIEW-D-2 User Browser Review:
          # sakana-tsuri-detail.html (the 2-image screenshots[] gallery from Pilot D).
          # Also adds assets/icons/sakana-tsuri.png: reading the detail page's source
          # found it references this icon via <img class="app-icon-img"
          # src="../assets/icons/sakana-tsuri.png">, which was not previously in this
          # allowlist (sakana-tsuri.html itself never needed it; only its detail page
          # does). All other sakana-tsuri-detail.html dependencies (favicon/manifest
          # set, ../sakana-tsuri.html, ../app-intro.html, ../switch-gaze-guide.html,
          # ../learning-records.html) are already covered by the copies above.
          cp source/app-details/sakana-tsuri-detail.html             dist/app-details/
          cp source/assets/mockups/sakana-tsuri-method-select.png    dist/assets/mockups/
          cp source/assets/mockups/sakana-tsuri.png                  dist/assets/mockups/
          cp source/assets/icons/sakana-tsuri.png                    dist/assets/icons/

          # SEO detail review: changed pages and directly linked related apps.
          cp source/hiragana-learn.html dist/
          cp source/nazori-app.html dist/
          cp source/sugoroku-app.html dist/
          cp source/katakana-app.html dist/
          cp source/nazorin-print.html dist/
          cp source/janken-app.html dist/
          cp source/app-details/hiragana-learn-detail.html dist/app-details/
          cp source/app-details/nazori-app-detail.html dist/app-details/
          cp source/app-details/sst-app-detail.html dist/app-details/
          cp source/app-details/sugoroku-app-detail.html dist/app-details/
          cp source/app-details/katakana-app-detail.html dist/app-details/
          cp source/app-details/nazorin-print-detail.html dist/app-details/
          cp source/app-details/janken-app-detail.html dist/app-details/
          cp source/assets/icons/hiragana-learn.png dist/assets/icons/
          cp source/assets/mockups/hiragana-learn.png dist/assets/mockups/
          # APP-DETAILS-VISUAL-ENHANCEMENT-HIRAGANA-PREVIEW-F-2: 2枚目の
          # screenshots[]エントリ(なぞりタブ、お手本ガイド付きcanvas)。
          # hiragana-learn.html/hiragana-learn-detail.html/assets/icons/
          # hiragana-learn.png/既存のassets/mockups/hiragana-learn.pngは既に
          # 別Phaseでallowlist済みのため、Phase Fで新規追加された1ファイルのみ足す。
          cp source/assets/mockups/hiragana-learn-trace.png dist/assets/mockups/
          cp source/assets/icons/nazori-app.png dist/assets/icons/
          cp source/assets/mockups/nazori-app.png dist/assets/mockups/
          cp source/assets/icons/sst-app.png dist/assets/icons/
          cp source/assets/mockups/sst-app.png dist/assets/mockups/
          # APP-DETAILS-VISUAL-ENHANCEMENT-SST-PREVIEW-E-2: 2枚目のscreenshots[]
          # エントリ(「4週間のふりかえり」画面、画面例・サンプルデータ)。
          # sst-app.html/sst-app-detail.html/assets/icons/sst-app.png/既存の
          # assets/mockups/sst-app.pngは既に別Phaseでallowlist済みのため、
          # ここではPhase Eで新規追加された1ファイルのみを足す。
          cp source/assets/mockups/sst-app-four-week-review.png dist/assets/mockups/
          cp source/assets/icons/sugoroku-app.png dist/assets/icons/
          cp source/assets/mockups/sugoroku-app.png dist/assets/mockups/
          cp source/assets/icons/katakana-app.png dist/assets/icons/
          cp source/assets/mockups/katakana-app.png dist/assets/mockups/
          cp source/assets/icons/nazorin-print.png dist/assets/icons/
          cp source/assets/mockups/nazorin-print.png dist/assets/mockups/
          cp source/assets/icons/janken-app.png dist/assets/icons/
          cp source/assets/mockups/janken-app.png dist/assets/mockups/
          cp source/assets/js/kana-record-detail.js dist/assets/js/
          cp source/assets/js/kana-record-trace-renderer.js dist/assets/js/
          cp source/assets/js/nazori-record-detail.js dist/assets/js/
          cp source/assets/js/pwa-register.js dist/assets/js/
          cp source/favicon-16.png dist/
          cp source/favicon-32.png dist/
          cp source/favicon.ico dist/
          cp source/site.webmanifest dist/
          cp source/app-intro.html dist/
          cp source/switch-gaze-guide.html dist/

          # SEO clock/register review: copy app pages, detail pages, images, and record dependency.
          cp source/tokei-app.html dist/
          cp source/register-app.html dist/
          cp source/app-details/tokei-app-detail.html dist/app-details/
          cp source/app-details/register-app-detail.html dist/app-details/
          cp source/assets/icons/tokei-app.png dist/assets/icons/
          cp source/assets/mockups/tokei-app.png dist/assets/mockups/
          cp source/assets/icons/register-app.png dist/assets/icons/
          cp source/assets/mockups/register-app.png dist/assets/mockups/
          cp source/assets/js/tokei-record-detail.js dist/assets/js/

          # COMMON-A11Y-STRICT-CONTAINMENT-PILOT-WAVE-1 User Browser Review: okane-app.html
          cp source/okane-app.html dist/
          cp source/assets/js/okane-record-detail.js dist/assets/js/

          # COMMON-A11Y-STRICT-CONTAINMENT-WAVE-2 User Browser Review: yomikaki-app.html /
          # slideshow-sakusei.html. Both apps have zero relative dependencies beyond the
          # favicon/manifest set already copied unconditionally above (verified by reading
          # the source HTML: only root-relative /favicon*, /apple-touch-icon.png,
          # /site.webmanifest hrefs), so no extra assets/js|icons|mockups copy is needed.
          cp source/yomikaki-app.html dist/
          cp source/slideshow-sakusei.html dist/

          # COMMON-A11Y-MODAL-COEXISTENCE-FIX-1-WAVE-A User Browser Review: shiritori2.html /
          # bosai-app.html (the 2 of the Wave A 5 target apps not yet allowlisted; janken-app.html,
          # tokei-app.html, ongaku-app.html are already allowlisted above). shiritori2.html loads
          # one relative dependency (assets/js/shiritori2-record-detail.js); bosai-app.html has
          # zero relative dependencies beyond the favicon/manifest set already copied
          # unconditionally above (both verified by reading the Wave A checkpoint source HTML).
          cp source/shiritori2.html dist/
          cp source/assets/js/shiritori2-record-detail.js dist/assets/js/
          cp source/bosai-app.html dist/

          # COMMON-A11Y-MATCHING-APP-STRICT-CONTAINMENT-FIX-1 User Browser Review:
          # matching-app.html. Zero relative dependencies beyond the favicon/manifest set
          # already copied unconditionally above (verified by reading the checkpoint source
          # HTML: only root-relative /favicon*, /apple-touch-icon.png, /site.webmanifest,
          # /learning-records.html hrefs; no app-specific assets/js record-detail renderer
          # exists in source).
          cp source/matching-app.html dist/

          # COMMON-A11Y-STRICT-CONTAINMENT-WAVE-4A-SUJI-FIX-1 User Browser Review:
          # suji-manabou.html. Zero relative dependencies beyond the favicon/manifest set
          # already copied unconditionally above (verified by reading the checkpoint source
          # HTML: only root-relative /favicon*, /apple-touch-icon.png, /site.webmanifest,
          # /learning-records.html hrefs, plus the relative favicon.png/favicon.svg/
          # apple-touch-icon.png hrefs that resolve against this same flat dist/ directory;
          # no app-specific assets/js record-detail renderer exists in source).
          cp source/suji-manabou.html dist/

          # DONOMANA-ACCESS-PHASE-2-FIXED-PREVIEW-1: Donomana Access(開発中、
          # Phase 2 Core Input & Feedback)のiPad Safari / AbleNet Blue2実機確認用。
          # donomana-access.htmlが参照する唯一の相対依存はassets/js/
          # donomana-access-core.jsのみ(sourceのdonomana-access.htmlを直接読んで
          # 確認済み、favicon/manifest等の<link>は無い)。テストファイル
          # (tools/donomana-access-poc/配下)はPreview公開対象外。
          cp source/donomana-access.html dist/
          cp source/assets/js/donomana-access-core.js dist/assets/js/

          # DONOMANA-REGISTER-QR-PHASE-3-5B: register-app.html(はんばいかい レジ、SEO
          # clock/register reviewで既にallowlist済み)のQR発行・カメラ読み取り機能が
          # 読み込むベンダーライブラリ(qrcode-generator / jsQR)とそのライセンス表示。
          # register-app.html自身のcp行(上のSEO clock/register reviewブロック)は無変更。
          #
          # 後方互換性: これらのファイルが存在しない過去のsource_ref(QRスキャナー機能
          # 追加前のregister-app.html、あるいは無関係な他checkpoint)でもPreview Syncが
          # 失敗しないよう、他の全cp行とは異なりこのブロックだけ「存在する場合のみ」
          # コピーする。存在しない場合は無音でスキップし(cp自体を実行しないため
          # `set -e`でのjob失敗にはならない)、manifestのsyncedFilesにも登録しない。
          mkdir -p dist/assets/js/vendor/qrcode-generator dist/assets/js/vendor/jsqr
          REGISTER_QR_VENDOR_FILES=""
          if [ -f source/assets/js/vendor/qrcode-generator/qrcode.js ]; then
            cp source/assets/js/vendor/qrcode-generator/qrcode.js   dist/assets/js/vendor/qrcode-generator/
            cp source/assets/js/vendor/qrcode-generator/LICENSE.txt dist/assets/js/vendor/qrcode-generator/
            cp source/assets/js/vendor/qrcode-generator/README.md   dist/assets/js/vendor/qrcode-generator/
            REGISTER_QR_VENDOR_FILES="$REGISTER_QR_VENDOR_FILES,\"assets/js/vendor/qrcode-generator/qrcode.js\",\"assets/js/vendor/qrcode-generator/LICENSE.txt\",\"assets/js/vendor/qrcode-generator/README.md\""
          fi
          if [ -f source/assets/js/vendor/jsqr/jsQR.js ]; then
            cp source/assets/js/vendor/jsqr/jsQR.js   dist/assets/js/vendor/jsqr/
            cp source/assets/js/vendor/jsqr/LICENSE.txt dist/assets/js/vendor/jsqr/
            cp source/assets/js/vendor/jsqr/README.md   dist/assets/js/vendor/jsqr/
            REGISTER_QR_VENDOR_FILES="$REGISTER_QR_VENDOR_FILES,\"assets/js/vendor/jsqr/jsQR.js\",\"assets/js/vendor/jsqr/LICENSE.txt\",\"assets/js/vendor/jsqr/README.md\""
          fi
          echo "REGISTER_QR_VENDOR_FILES=$REGISTER_QR_VENDOR_FILES" >> "$GITHUB_ENV"

      - name: Generate preview-manifest.json (Preview-only, not part of source)
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ACTUAL_SHA: ${{ steps.resolve.outputs.actual_sha }}
          SYNCED_AT: ${{ steps.resolve.outputs.synced_at }}
        run: |
          set -euo pipefail
          cat > dist/preview-manifest.json <<JSON
          {
            "sourceRepo": "education-tools-hash/for-all-children-to-learn",
            "sourceRef": "$SOURCE_REF",
            "sourceCommit": "$ACTUAL_SHA",
            "syncedAt": "$SYNCED_AT",
            "syncedFiles": [
              "schedule-app.html",
              "timetable-app.html",
              "cup_game.html",
              "directions-app.html",
              "ongaku-app.html",
              "sst-app.html",
              "learning-records.html",
              "assets/js/directions-record-detail.js",
              "assets/js/sst-record-detail.js",
              "assets/js/record-dashboard-foundation.js",
              "assets/js/record-dashboard-ui.js",
              "favicon.png",
              "favicon.svg",
              "apple-touch-icon.png",
              "sawatte-hirogaru-app.html",
              "assets/js/record-trace-renderer.js",
              "assets/js/sawatte-hirogaru-record-detail.js",
              "app-details/sawatte-hirogaru-app-detail.html",
              "assets/mockups/sawatte-hirogaru-app.png",
              "sakana-tsuri.html",
              "assets/sakana-tsuri/pond-background.jpg",
              "assets/sakana-tsuri/orange-fish.png",
              "assets/sakana-tsuri/fishing-rod.png",
              "assets/sakana-tsuri/pond-autumn.jpg",
              "assets/sakana-tsuri/forest-stream.jpg",
              "assets/sakana-tsuri/red-white-fish.png",
              "assets/sakana-tsuri/spotted-fish.png",
              "assets/js/sakana-tsuri-record-detail.js",
              "app-details/sakana-tsuri-detail.html",
              "assets/mockups/sakana-tsuri-method-select.png",
              "assets/mockups/sakana-tsuri.png",
              "assets/icons/sakana-tsuri.png",
              "hiragana-learn.html",
              "nazori-app.html",
              "sugoroku-app.html",
              "katakana-app.html",
              "nazorin-print.html",
              "janken-app.html",
              "app-details/hiragana-learn-detail.html",
              "app-details/nazori-app-detail.html",
              "app-details/sst-app-detail.html",
              "app-details/sugoroku-app-detail.html",
              "app-details/katakana-app-detail.html",
              "app-details/nazorin-print-detail.html",
              "app-details/janken-app-detail.html",
              "assets/icons/hiragana-learn.png",
              "assets/mockups/hiragana-learn.png",
              "assets/mockups/hiragana-learn-trace.png",
              "assets/icons/nazori-app.png",
              "assets/mockups/nazori-app.png",
              "assets/icons/sst-app.png",
              "assets/mockups/sst-app.png",
              "assets/mockups/sst-app-four-week-review.png",
              "assets/icons/sugoroku-app.png",
              "assets/mockups/sugoroku-app.png",
              "assets/icons/katakana-app.png",
              "assets/mockups/katakana-app.png",
              "assets/icons/nazorin-print.png",
              "assets/mockups/nazorin-print.png",
              "assets/icons/janken-app.png",
              "assets/mockups/janken-app.png",
              "assets/js/kana-record-detail.js",
              "assets/js/kana-record-trace-renderer.js",
              "assets/js/nazori-record-detail.js",
              "assets/js/pwa-register.js",
              "favicon-16.png",
              "favicon-32.png",
              "favicon.ico",
              "site.webmanifest",
              "app-intro.html",
              "switch-gaze-guide.html",
              "tokei-app.html",
              "register-app.html",
              "app-details/tokei-app-detail.html",
              "app-details/register-app-detail.html",
              "assets/icons/tokei-app.png",
              "assets/mockups/tokei-app.png",
              "assets/icons/register-app.png",
              "assets/mockups/register-app.png",
              "assets/js/tokei-record-detail.js",
              "okane-app.html",
              "assets/js/okane-record-detail.js",
              "yomikaki-app.html",
              "slideshow-sakusei.html",
              "shiritori2.html",
              "assets/js/shiritori2-record-detail.js",
              "bosai-app.html",
              "matching-app.html",
              "suji-manabou.html",
              "donomana-access.html",
              "assets/js/donomana-access-core.js"$REGISTER_QR_VENDOR_FILES
            ]
          }
          JSON

      - name: Generate Preview index.html (Preview-only, not part of source)
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ACTUAL_SHA: ${{ steps.resolve.outputs.actual_sha }}
          SYNCED_AT: ${{ steps.resolve.outputs.synced_at }}
        run: |
          set -euo pipefail
          cat > dist/index.html <<HTML
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <title>DONOMANA PREVIEW</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;line-height:1.7;color:#1f2937}
            .banner{background:#fff3cd;border:2px solid #d97706;border-radius:8px;padding:1rem 1.2rem;margin-bottom:1.5rem;font-weight:bold;color:#92400e}
            dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:1rem 0}
            dt{font-weight:bold;color:#6b7280} dd{margin:0}
            code{background:#f1f5f9;padding:.15rem .4rem;border-radius:4px;word-break:break-all}
            ul{padding-left:1.2rem;line-height:2}
            a{color:#2563eb}
          </style>
          </head>
          <body>
          <div class="banner">&#9888; これはDONOMANA PREVIEW環境です。Production (donomana.jp) ではありません。</div>
          <dl>
            <dt>source repo</dt><dd><code>education-tools-hash/for-all-children-to-learn</code></dd>
            <dt>source ref</dt><dd><code>$SOURCE_REF</code></dd>
            <dt>source commit</dt><dd><code>$ACTUAL_SHA</code></dd>
            <dt>synced at</dt><dd><code>$SYNCED_AT</code> (UTC)</dd>
          </dl>
          <ul>
            <li><a href="schedule-app.html">schedule-app.html</a></li>
            <li><a href="timetable-app.html">timetable-app.html</a></li>
            <li><a href="cup_game.html">cup_game.html</a></li>
            <li><a href="directions-app.html">directions-app.html</a></li>
            <li><a href="ongaku-app.html">ongaku-app.html</a></li>
            <li><a href="sst-app.html">sst-app.html</a></li>
            <li><a href="learning-records.html">learning-records.html</a></li>
            <li><a href="sawatte-hirogaru-app.html">sawatte-hirogaru-app.html</a></li>
            <li><a href="app-details/sawatte-hirogaru-app-detail.html">sawatte-hirogaru-app SEO確認</a></li>
            <li><a href="sakana-tsuri.html">sakana-tsuri.html</a></li>
            <li><a href="app-details/sakana-tsuri-detail.html">sakana-tsuri SEO確認</a></li>
            <li><a href="okane-app.html">okane-app.html</a></li>
            <li><a href="yomikaki-app.html">yomikaki-app.html</a></li>
            <li><a href="slideshow-sakusei.html">slideshow-sakusei.html</a></li>
            <li><a href="shiritori2.html">shiritori2.html</a></li>
            <li><a href="bosai-app.html">bosai-app.html</a></li>
            <li><a href="matching-app.html">matching-app.html</a></li>
            <li><a href="app-details/hiragana-learn-detail.html">hiragana-learn SEO確認</a></li>
            <li><a href="app-details/nazori-app-detail.html">nazori-app SEO確認</a></li>
            <li><a href="app-details/sst-app-detail.html">sst-app SEO確認</a></li>
            <li><a href="app-details/sugoroku-app-detail.html">sugoroku-app SEO確認</a></li>
            <li><a href="app-details/tokei-app-detail.html">とけい SEO確認</a></li>
            <li><a href="app-details/register-app-detail.html">はんばいかい レジ SEO確認</a></li>
            <li><a href="donomana-access.html">donomana-access.html（開発中・iPad/Blue2実機確認用）</a></li>
          </ul>
          <p><a href="preview-manifest.json">preview-manifest.json</a></p>
          </body>
          </html>
          HTML

      - name: Generate robots.txt (search engine exclusion, not secrecy)
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
